name: Keep Bot Alive

on:
  schedule:
    # Run every 5 minutes to keep bot alive
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot startup endpoint
        run: |
          echo "🤖 Keeping bot alive..."
          curl -f https://ai-claude-fitness.vercel.app/api/startup -w "\nStatus: %{http_code}\n" || echo "❌ Ping failed, will retry"

      - name: Log success
        if: success()
        run: echo "✅ Bot ping successful at $(date)"
